DESCRIPTION = "Machine configuration for the RK3566 Acropi board"
TARGET_ARCH = "aarch64"

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "rk3568_defconfig"

# Updated per user request
SERIAL_CONSOLES = "1500000;ttyS2"

EXTRA_IMAGEDEPENDS += "u-boot"
RK_LOADER_BIN = "rk356x_spl_loader_v1.18.112.bin"

PREFERRED_PROVIDER_virtual/kernel = "linux-rockchip"
PREFERRED_VERSION_linux-rockchip = "6.1%"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/rk3566-acropi-lp4x.dtb"
MACHINE_FEATURES = "ext2 ipa3 serial usbhost vfat"

IMAGE_FSTYPES += "ext4"

# --- USB RNDIS Hardware Support ---
MACHINE_EXTRA_RDEPENDS += "kernel-module-libcomposite kernel-module-u-ether kernel-module-usb-f-rndis kpoky-config rtl8812eu"
KERNEL_MODULE_AUTOLOAD += "libcomposite u_ether usb_f_rndis 8812eu"
