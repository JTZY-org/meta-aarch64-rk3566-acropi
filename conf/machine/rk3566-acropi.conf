DESCRIPTION = "Machine configuration for the RK3566 Acropi board"
TARGET_ARCH = "aarch64"

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
# Placeholder for device tree, user might need to adjust
KERNEL_DEVICETREE = "rockchip/rk3566-box-demo.dtb"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "rk3568_defconfig"

SERIAL_CONSOLES = "1500000;ttyS2"

IMAGE_FSTYPES += "wic.gz"
WKS_FILE ?= "rk3566-acropi.wks"

# Boot files for wic image
IMAGE_BOOT_FILES = "boot.img resource.img"