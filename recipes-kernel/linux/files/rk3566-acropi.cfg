CONFIG_DRM=y
CONFIG_ROCKCHIP_ANALOGIX_DP=y
CONFIG_PHY_ROCKCHIP_NANENG_EDP=y
CONFIG_ROCKCHIP_DW_MIPI_DSI=y
CONFIG_PHY_ROCKCHIP_INNO_DSIDPHY=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_PWM_ROCKCHIP=y
CONFIG_BACKLIGHT_PWM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_FBDEV_OVERALLOC=100
CONFIG_CLK_RK3568=y
CONFIG_CPU_RK3568=y
CONFIG_ROCKCHIP_IODOMAIN=y
CONFIG_ROCKCHIP_PM_DOMAINS=y
CONFIG_ROCKCHIP_RKNPU=y
CONFIG_MALI_BIFROST=y
CONFIG_MALI_PLATFORM_NAME="rk"
CONFIG_PHY_ROCKCHIP_NANENG_COMBO_PHY=y
CONFIG_TRACING=y
CONFIG_FTRACE=y
CONFIG_TRACEPOINTS=y
CONFIG_EVENT_TRACING=y
CONFIG_KPROBES=y
CONFIG_KRETPROBES=y
CONFIG_UPROBES=y
CONFIG_ROCKCHIP_OPP=y
CONFIG_ROCKCHIP_SYSTEM_MONITOR=y
CONFIG_NVMEM_ROCKCHIP_OTP=y
CONFIG_ROCKCHIP_THERMAL=y

# --- Missing/Updated Hardware Support ---
# Audio (rk809-sound)
CONFIG_SND_SIMPLE_CARD=y
CONFIG_SND_SOC_RK817=y
CONFIG_SND_SOC_ROCKCHIP=y
CONFIG_SND_SOC_ROCKCHIP_I2S=y

# Video / Camera / Acceleration
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_V4L2_FWNODE=y
CONFIG_V4L2_ASYNC=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_OV5695=m
CONFIG_VIDEO_ROCKCHIP_ISP=m
CONFIG_VIDEO_ROCKCHIP_ISP_VERSION_V21=y
CONFIG_VIDEO_ROCKCHIP_ISPP=m
CONFIG_VIDEO_ROCKCHIP_CIF=y
CONFIG_PHY_ROCKCHIP_MIPI_RX=m
# CONFIG_VIDEO_ROCKCHIP_RGA is not set
CONFIG_ROCKCHIP_MULTI_RGA=y
CONFIG_ROCKCHIP_RGA_ASYNC=y
CONFIG_ROCKCHIP_RGA_PROC_FS=y
CONFIG_ROCKCHIP_RGA_DEBUG_FS=y


# Video Codecs (RKVENC, RKVDEC, VPU)
CONFIG_ROCKCHIP_MPP_SERVICE=y
CONFIG_ROCKCHIP_MPP_OSAL=y
CONFIG_ROCKCHIP_MPP_RKVENC=y
CONFIG_ROCKCHIP_MPP_RKVDEC=y
CONFIG_ROCKCHIP_MPP_VEPU2=y
CONFIG_ROCKCHIP_MPP_VDPU2=y
CONFIG_ROCKCHIP_MPP_JPGDEC=y

# Memory Management
CONFIG_CMA_SIZE_MBYTES=256
CONFIG_DMABUF_HEAPS=y
CONFIG_DMABUF_HEAPS_SYSTEM=y
CONFIG_DMABUF_HEAPS_CMA=y
CONFIG_DMABUF_HEAPS_ROCKCHIP=y
CONFIG_DMABUF_HEAPS_ROCKCHIP_CMA_HEAP=y
CONFIG_UDMABUF=y
CONFIG_DMABUF_DEBUG=y
CONFIG_DMABUF_SYSFS_STATS=y

# Peripherals
CONFIG_SPI_SPIDEV=y
CONFIG_PHY_ROCKCHIP_CSI2_DPHY=y

# --- High-Real-Time and RCU Optimizations ---
# Enable PREEMPT for lower latency (Already in .config, but ensuring it's here)
CONFIG_PREEMPT=y

# RCU Optimization for High-RT Tasks
# CONFIG_RCU_EXPERT=y allows enabling NOCB
CONFIG_RCU_EXPERT=y
# CONFIG_RCU_NOCB_CPU=y offloads RCU callbacks from RT CPUs
CONFIG_RCU_NOCB_CPU=y
# Increase RCU stall timeout to avoid false positives during heavy RT load
CONFIG_RCU_CPU_STALL_TIMEOUT=60

# Full Tickless Mode to reduce jitter on RT CPUs
# Depends on CONFIG_VIRT_CPU_ACCOUNTING_GEN=y
CONFIG_VIRT_CPU_ACCOUNTING_GEN=y
CONFIG_NO_HZ_FULL=y

# Kernel Tick Rate - 1000Hz for finer scheduling
# We set CONFIG_HZ=1000 by choosing the correct HZ value
CONFIG_HZ_1000=y
CONFIG_HZ=1000

# --- PREEMPT_RT Implementation ---
CONFIG_EXPERT=y
CONFIG_PREEMPT_RT=y
CONFIG_CPU_THERMAL=y
CONFIG_THERMAL_WRITABLE_TRIPS=y
CONFIG_ROCKCHIP_THERMAL=y
CONFIG_CPUFREQ_DT=y

# Disable Framebuffer Console (fbcon)
# CONFIG_FRAMEBUFFER_CONSOLE is not set
# CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY is not set
# CONFIG_LOGO is not set

# Enable SquashFS Support for Read-Only RootFS
CONFIG_BLOCK=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_LZO=y
CONFIG_SQUASHFS_XZ=y

# Enable OverlayFS Support for read-write overlay mounts
CONFIG_OVERLAY_FS=y

# USB HID Touchscreen Support
CONFIG_INPUT=y
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_HID_MULTITOUCH=y
